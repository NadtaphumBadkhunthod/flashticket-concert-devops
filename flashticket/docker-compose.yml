version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: flashticket-db
    restart: always
    environment:
      POSTGRES_USER: flashticket
      POSTGRES_PASSWORD: flashticket_secure_pass
      POSTGRES_DB: flashticket_db
    ports:
      - "5432:5432"
    volumes:
      - flashticket_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashticket -d flashticket_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - flashticket-net

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: flashticket-web
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: flashticket_db
      DB_USER: flashticket
      DB_PASSWORD: flashticket_secure_pass
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flashticket-net

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: flashticket-node-exporter
    restart: always
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - flashticket-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: flashticket-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - flashticket_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - web
      - node-exporter
    networks:
      - flashticket-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: flashticket-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - flashticket_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - flashticket-net

networks:
  flashticket-net:
    driver: bridge

volumes:
  flashticket_db_data:
  flashticket_prometheus_data:
  flashticket_grafana_data:
